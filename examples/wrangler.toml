name = "exchange-gateway-edge"
main = "../worker/index.js"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
GATEWAY_HOST = "exchange.example.com"
ORIGIN_BASE_URL = "https://exchange-origin.example.com"
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_MAX = "120"
RATE_LIMIT_WINDOW_SEC = "60"
SQL_API_ENABLED = "false"
MAX_FORWARD_BODY_BYTES = "4194304"
MAX_API_BODY_BYTES = "262144"

[[d1_databases]]
binding = "EXCHANGE_DB"
database_name = "exchange-gateway"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["0 * * * *"]

[build]
command = ""

[env.preview]
name = "exchange-gateway-edge-preview"

[env.preview.vars]
GATEWAY_HOST = "exchange-preview.example.com"
ORIGIN_BASE_URL = "https://exchange-origin-preview.example.com"
RATE_LIMIT_ENABLED = "false"
SQL_API_ENABLED = "true"
MAX_FORWARD_BODY_BYTES = "4194304"
MAX_API_BODY_BYTES = "262144"

[[env.preview.d1_databases]]
binding = "EXCHANGE_DB"
database_name = "exchange-gateway-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"
