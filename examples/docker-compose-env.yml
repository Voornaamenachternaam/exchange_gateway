# docker-compose.yml
# Cloudflare Tunnel + Exchange Gateway Setup
#
# This docker-compose.yml includes both:
#   1. Exchange Gateway (calendar protocol proxy)
#   2. Cloudflare Tunnel (cloudflared) for TLS termination
#
# Configuration Options:
#   - Environment Variables (recommended): Set directly in this file or .env
#   - Config File: Mount exchange-gateway.config.toml to /etc/exchange-gateway/config.toml
#
# Environment Variables (all prefixed with GATEWAY_):
#   GATEWAY_BIND              - Listen address (default: [::]:8134)
#   GATEWAY_CALDAV_BASE       - Stalwart CalDAV URL (required)
#   GATEWAY_DATABASE_PATH     - SQLite database path (default: /var/lib/exchange-gateway/gateway.db)
#   GATEWAY_HMAC_SECRET       - HMAC secret (min 32 chars, required)
#   GATEWAY_HOST              - Public hostname for Autodiscover (required)
#   GATEWAY_MAIL_DOMAIN       - Mail domain for calendar items (required)
#   GATEWAY_MAX_ATTACHMENT_BYTES - Max attachment size (default: 5242880)
#   GATEWAY_ROOM_BOOKING_ENABLED - Enable room booking (default: true)
#   GATEWAY_AUTH_CACHE_TTL_SECS - Auth cache TTL (default: 300)
#   GATEWAY_AUTH_CACHE_MAX_ENTRIES - Max auth cache entries (default: 10000)
#
# Usage:
#   1. Set required environment variables below
#   2. docker-compose up -d
#   3. docker-compose logs -f cloudflared

services:
  exchange-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-gateway
    image: exchange-gateway:latest
    restart: unless-stopped
    expose:
      - "8134"
    environment:
      - RUST_LOG=info
      - TZ=UTC
      # Required Configuration
      - GATEWAY_CALDAV_BASE=http://stalwart:8080/dav/
      - GATEWAY_HMAC_SECRET=REPLACE_WITH_32_CHARACTER_MINIMUM_SECRET
      - GATEWAY_HOST=calendar.stalwart.example.com
      - GATEWAY_MAIL_DOMAIN=example.com
      # Optional Configuration
      - GATEWAY_BIND=[::]:8134
      - GATEWAY_DATABASE_PATH=/var/lib/exchange-gateway/gateway.db
      - GATEWAY_MAX_ATTACHMENT_BYTES=5242880
      - GATEWAY_ROOM_BOOKING_ENABLED=true
      - GATEWAY_AUTH_CACHE_TTL_SECS=300
      - GATEWAY_AUTH_CACHE_MAX_ENTRIES=10000
    volumes:
      - exchange-gateway-data:/var/lib/exchange-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8134/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    depends_on:
      exchange-gateway:
        condition: service_healthy
    command: tunnel run --config /etc/cloudflared/config.yml
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    network_mode: service:exchange-gateway

volumes:
  exchange-gateway-data:
    driver: local

networks:
  default:
    name: exchange-gateway-network