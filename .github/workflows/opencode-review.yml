name: opencode-review

on:
  pull_request:
  
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure git identity
        run: |
          git config user.name "Voornaamenachternaam"
          git config user.email "84537103+Voornaamenachternaam@users.noreply.github.com"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/nemotron-free
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs and provide commit suggestions to fix them
            - Provide improvements as commit suggestions
