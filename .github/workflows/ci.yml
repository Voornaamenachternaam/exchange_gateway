name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Run cargo test, clippy, fmt, and fuzz check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          profile: minimal
          toolchain: stable
          components: clippy, rustfmt
          override: true

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo test --locked
        run: |
          set -euo pipefail
          cargo test --locked

      - name: Run cargo clippy --locked --all-targets -- -D warnings
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run cargo fmt --check
        run: |
          set -euo pipefail
          cargo fmt --check

      - name: Run cargo check --locked --manifest-path fuzz/Cargo.toml
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path fuzz/Cargo.toml

      - name: Run Criterion benchmark smoke runs
        run: |
          set -euo pipefail
          cargo bench --locked --bench hot_paths -- --list | sed -n '1p'
          cargo bench --locked --bench hot_paths -- --save-baseline baseline --measurement-time 1

  dependabot:
    name: Dependabot coverage for /fuzz
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify fuzz lockfile exists
        run: |
          test -f fuzz/Cargo.lock
