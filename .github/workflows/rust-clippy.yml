name: rust-clippy analyze

on:
  workflow_dispatch: {}
  schedule:
    - cron: '40 2 * * *'

permissions:
  contents: write
  pull-requests: write
  checks: write
  security-events: write
  actions: read

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          profile: minimal
          toolchain: stable
          components: clippy
          override: true

      - name: Ensure clippy component is available
        run: |
          set -euo pipefail
          rustup component add clippy || true

      - name: Install SARIF tooling
        run: |
          set -euo pipefail
          cargo install --force clippy-sarif sarif-fmt
        continue-on-error: true

      - name: Run cargo clippy --fix
        run: |
          set -euo pipefail
          cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features || true

      - name: Create Pull Request with fixes
        uses: peter-evans/create-pull-request@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: clippy-fixes
          delete-branch: false
          title: Apply automatic suggestions from cargo clippy --fix
          body: This PR contains automatic fixes applied by `cargo clippy --fix`.
          labels: auto-clippy,ci
          commit-message: Apply automatic suggestions from cargo clippy --fix

      - name: Run Clippy (annotations)
        uses: auguwu/clippy-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate SARIF output
        run: |
          set -euo pipefail
          cargo clippy --all-features --message-format=json \
            | clippy-sarif \
            | tee rust-clippy-results.sarif \
            | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
        continue-on-error: true
 
