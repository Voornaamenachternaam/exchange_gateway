name: Daily PDF to NDJSON Processor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  process-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Primary URL (use the exact URL you want). Keep the value you used before if that is authoritative.
      TARGET_URL: 'https://web.core.windows.net/files/Zip_Files/Exchange_Protocols.zip'
      # An alternate fully-qualified host we observed earlier — keep as fallback.
      ALTERNATE_URL: 'https://officeprotocoldoc.z19.web.core.windows.net/files/Zip_Files/Exchange_Protocols.zip'
      # Name used for the downloaded artifact
      ZIP_FILENAME: 'exchange_protocols.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
          check-latest: true

      - name: Install system tools (unzip, curl, dnsutils)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl dnsutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypdf

      - name: Robustly download ZIP (tries multiple hosts, diagnostics on failure)
        shell: bash
        run: |
          set -euo pipefail

          PRIMARY_URL="${TARGET_URL}"
          ALT_URL="${ALTERNATE_URL}"
          OUT="${ZIP_FILENAME}"

          echo "Attempting to download primary URL: $PRIMARY_URL"
          # Try both URLs in order. For each, try curl with retries and --ipv4 for reliability.
          urls=( "$PRIMARY_URL" "$ALT_URL" )

          success=0
          for url in "${urls[@]}"; do
            if [ -z "$url" ] || [ "$url" = "https://web.core.windows.net/files/Zip_Files/Exchange_Protocols.zip" -a "$url" = "$PRIMARY_URL" ]; then
              # keep the user-specified URL; sometimes it's intentionally that host.
              :
            fi
            echo "Trying URL: $url"
            set +e
            # keep verbose output for logs (save to file)
            CURL_VERBOSE="curl_verbose_$(echo "$url" | tr '/:' '_').log"
            # curl: -f => fail on HTTP error; -L => follow redirects; retries enabled
            curl --fail --show-error --location --ipv4 --connect-timeout 20 --max-time 300 \
              --retry 5 --retry-delay 5 --retry-connrefused \
              -o "$OUT" "$url" 2> "$CURL_VERBOSE"
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              echo "Download succeeded from: $url"
              success=1
              break
            else
              echo "Download failed from: $url (curl rc=$rc). Verbose log below:"
              echo "----- begin curl verbose ($CURL_VERBOSE) -----"
              sed -n '1,200p' "$CURL_VERBOSE" || true
              echo "----- end curl verbose -----"
              echo
              # run quick DNS diagnostics for this host
              host=$(printf "%s" "$url" | awk -F/ '{print $3}')
              echo "DNS lookup for host: $host"
              nslookup "$host" || echo "nslookup failed for $host"
              echo "Attempting to continue to next URL if available..."
            fi
          done

          if [ $success -ne 1 ]; then
            echo "ERROR: All download attempts failed. See curl logs above and DNS outputs." >&2
            # Create a small diagnostic file to help debugging locally
            echo "download-failure" > download_failure.marker
            ls -la || true
            # print environment info
            echo "Runner environment summary:" > runner_env.txt
            uname -a >> runner_env.txt
            echo "Python:" >> runner_env.txt
            python --version >> runner_env.txt
            echo "Network diagnostics:" >> runner_env.txt
            echo "Resolving primary host:" >> runner_env.txt
            host_primary=$(printf "%s" "$PRIMARY_URL" | awk -F/ '{print $3}') || true
            ( nslookup "$host_primary" >> runner_env.txt 2>&1 ) || true
            echo "Resolving alternate host:" >> runner_env.txt
            host_alt=$(printf "%s" "$ALT_URL" | awk -F/ '{print $3}') || true
            ( nslookup "$host_alt" >> runner_env.txt 2>&1 ) || true
            # List any curl verbose files
            echo "Curl logs (first 200 lines each):" >> runner_env.txt
            for f in curl_verbose_*.log; do
              echo "---- $f ----" >> runner_env.txt
              sed -n '1,200p' "$f" >> runner_env.txt 2>&1 || true
            done
            # show files to upload as diagnostics
            echo "Diagnostic files created:"
            ls -la download_failure.marker runner_env.txt curl_verbose_*.log || true
            # fail the step so the job stops (non-zero)
            exit 6
          fi

          # show zip contents for confirmation
          echo "Downloaded zip file:"
          unzip -l "$OUT" || ( echo "unzip listing failed" && exit 7 )

      - name: Extract PDFs
        run: |
          set -euo pipefail
          unzip -o -j "$ZIP_FILENAME" "*.pdf"
          echo "PDF files extracted:"
          ls -la *.pdf || true

      - name: Convert PDFs → gzipped NDJSON (one JSON object per page, streaming)
        shell: bash
        run: |
          set -euo pipefail

          cat > process_pdfs_to_ndjson_gz.py <<'PY'
          #!/usr/bin/env python3
          import glob
          import json
          import gzip
          import hashlib
          import os
          import sys
          from datetime import datetime
          from pypdf import PdfReader

          OUT_PATH = "Exchange_Protocols_pages.ndjson.gz"
          pdf_files = sorted(glob.glob("*.pdf"))

          if not pdf_files:
              print("ERROR: no PDF files found in working directory", file=sys.stderr)
              sys.exit(2)

          total_pages_written = 0
          files_summary = []

          # Write header manifest, then per-page objects, then final manifest.
          with gzip.open(OUT_PATH, "wt", encoding="utf-8") as out:
              header = {
                  "type": "manifest",
                  "status": "in_progress",
                  "generated_at": datetime.utcnow().isoformat() + "Z",
                  "file_count": len(pdf_files),
                  "note": "Header manifest. Final manifest appended when processing completes."
              }
              out.write(json.dumps(header, ensure_ascii=False) + "\n")
              out.flush()

              for pdf_path in pdf_files:
                  filename = os.path.basename(pdf_path)

                  # compute sha256
                  sha256 = hashlib.sha256()
                  try:
                      with open(pdf_path, "rb") as f:
                          for chunk in iter(lambda: f.read(65536), b""):
                              sha256.update(chunk)
                      sha256_hex = sha256.hexdigest()
                  except Exception as e:
                      print(f"ERROR computing sha256 for {pdf_path}: {e}", file=sys.stderr)
                      sha256_hex = None

                  # open PDF
                  try:
                      reader = PdfReader(pdf_path)
                      pages_count = len(reader.pages)
                  except Exception as e:
                      err_obj = {
                          "type": "file_error",
                          "filename": filename,
                          "error": f"PdfReader open failed: {repr(e)}"
                      }
                      out.write(json.dumps(err_obj, ensure_ascii=False) + "\n")
                      out.flush()
                      files_summary.append({
                          "filename": filename,
                          "pages_expected": None,
                          "pages_written": 0,
                          "sha256": sha256_hex,
                          "errors": [str(e)]
                      })
                      continue

                  file_errors = []
                  pages_written = 0

                  for i, page in enumerate(reader.pages, start=1):
                      try:
                          text = page.extract_text()
                          if text is None:
                              text = ""
                      except Exception as e:
                          err = f"extract_text error on page {i}: {repr(e)}"
                          file_errors.append(err)
                          text = ""

                      obj = {
                          "type": "page",
                          "filename": filename,
                          "page": i,
                          "pages_total": pages_count,
                          "sha256": sha256_hex,
                          "text": text
                      }
                      out.write(json.dumps(obj, ensure_ascii=False) + "\n")
                      pages_written += 1
                      total_pages_written += 1

                      # periodic flush to minimize data-loss window
                      if pages_written % 50 == 0:
                          out.flush()

                  files_summary.append({
                      "filename": filename,
                      "pages_expected": pages_count,
                      "pages_written": pages_written,
                      "sha256": sha256_hex,
                      "errors": file_errors
                  })

              final_manifest = {
                  "type": "manifest",
                  "status": "complete",
                  "generated_at": datetime.utcnow().isoformat() + "Z",
                  "file_count": len(pdf_files),
                  "total_pages_written": total_pages_written,
                  "files": files_summary
              }
              out.write(json.dumps(final_manifest, ensure_ascii=False) + "\n")
              out.flush()

          # final checks
          if not os.path.exists(OUT_PATH):
              print("ERROR: output file was not created", file=sys.stderr)
              sys.exit(3)

          # compute missing pages (best-effort)
          missing_pages = sum( (f["pages_expected"] or 0) - f["pages_written"] for f in files_summary )
          if missing_pages > 0:
              print(f"ERROR: {missing_pages} pages missing according to manifests. See final manifest inside {OUT_PATH}", file=sys.stderr)
              sys.exit(4)

          print(f"Success: wrote {total_pages_written} pages into {OUT_PATH}")
          PY

          python process_pdfs_to_ndjson_gz.py

      - name: Validate NDJSON.gz final manifest (sanity)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, sys, os

          path = "Exchange_Protocols_pages.ndjson.gz"
          if not os.path.exists(path):
              print("ERROR: artifact not found for validation", file=sys.stderr)
              sys.exit(2)

          last_manifest = None
          try:
              with gzip.open(path, "rt", encoding="utf-8") as fh:
                  for line in fh:
                      try:
                          obj = json.loads(line)
                      except Exception:
                          continue
                      if isinstance(obj, dict) and obj.get("type") == "manifest":
                          last_manifest = obj
          except Exception as e:
              print("ERROR reading gz file for validation:", e, file=sys.stderr)
              sys.exit(3)

          if not last_manifest:
              print("ERROR: No manifest found in artifact", file=sys.stderr)
              sys.exit(4)

          if last_manifest.get("status") != "complete":
              print("ERROR: final manifest status is not 'complete':", last_manifest.get("status"), file=sys.stderr)
              sys.exit(5)

          files = last_manifest.get("files", [])
          problematic = []
          for f in files:
              exp = f.get("pages_expected")
              written = f.get("pages_written", 0)
              errs = f.get("errors", [])
              if exp is not None and written != exp:
                  problematic.append(f"page-count-mismatch for {f.get('filename')}: expected {exp}, written {written}")
              if errs:
                  problematic.append(f"errors for {f.get('filename')}: {errs}")

          if problematic:
              print("ERROR: Validation failed. Problems detected:")
              for p in problematic:
                  print("  -", p)
              sys.exit(6)

          print("Validation OK: final manifest complete and all files/pages validated.")
          sys.exit(0)
          PY

      - name: Upload NDJSON.gz artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exchange-protocols-ndjson
          path: Exchange_Protocols_pages.ndjson.gz
          retention-days: 5
