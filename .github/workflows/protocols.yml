name: Daily PDF to Excel Processor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  process-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.13'
          check-latest: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl pdfplumber

      - name: Download and Extract ZIP
        env:
          TARGET_URL: 'https://officeprotocoldoc.z19.web.core.windows.net/files/Zip_Files/Exchange_Protocols.zip'
        run: |
          curl -L "$TARGET_URL" -o exchange_protocols.zip
          unzip -o -j exchange_protocols.zip "*.pdf"

      - name: Convert PDFs to Excel
        run: |
          cat > process_pdfs.py << 'EOF'
          import os
          import glob
          import re
          import pandas as pd
          import pdfplumber

          pdf_files = sorted(glob.glob("*.pdf"))
          output_file = "Exchange protocols.xlsx"
          used_sheet_names = set()

          if not pdf_files:
              raise RuntimeError("No PDF files found")

          with pd.ExcelWriter(output_file, engine="openpyxl") as writer:
              for pdf_path in pdf_files:
                  full_text = []

                  with pdfplumber.open(pdf_path) as pdf:
                      for page in pdf.pages:
                          text = page.extract_text()
                          if text:
                              full_text.extend(text.splitlines())

                  if not full_text:
                      full_text.append("")

                  df = pd.DataFrame(full_text, columns=["Content"])

                  base = os.path.splitext(os.path.basename(pdf_path))[0]
                  clean = re.sub(r'[\\/*?:\[\]]', '', base).strip()
                  sheet = clean[:31]

                  if not sheet:
                      sheet = "Sheet"

                  original = sheet
                  index = 1
                  while sheet in used_sheet_names:
                      suffix = f"_{index}"
                      sheet = original[:31 - len(suffix)] + suffix
                      index += 1

                  used_sheet_names.add(sheet)
                  df.to_excel(writer, sheet_name=sheet, index=False)

          if not os.path.exists(output_file):
              raise RuntimeError("Excel file was not created")
          EOF

          python process_pdfs.py

      - name: Upload Excel Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: daily-pdf-report
          path: Exchange protocols.xlsx
          retention-days: 5
