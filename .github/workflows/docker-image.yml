name: Publish Docker image on release

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  publish:
    name: Build & publish multi-arch Docker image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set release metadata and validate required secrets
        id: set-metadata
        shell: bash
        run: |
          set -euo pipefail

          # Get canonical release tag from the event payload
          RELEASE_TAG="${{ github.event.release.tag_name || '' }}"
          if [ -z "$RELEASE_TAG" ]; then
          echo "ERROR: release tag not found (github.event.release.tag_name is empty)." >&2
          exit 1
          fi

          # Validate required secrets: only DOCKER_USERNAME and DOCKER_PASSWORD are permitted
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "ERROR: secret DOCKER_USERNAME is not set. Please set DOCKER_USERNAME in repository secrets." >&2
          exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
          echo "ERROR: secret DOCKER_PASSWORD is not set. Please set DOCKER_PASSWORD in repository secrets." >&2
          exit 1
          fi

          # Repository name (use GitHub repo name as docker repository)
          REPO_NAME="${{ github.event.repository.name || github.repository }}"
          if [ -z "$REPO_NAME" ]; then
          echo "ERROR: repository name not available from event payload." >&2
          exit 1
          fi

          # Compose image name: <docker-username>/<repo-name>
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/${REPO_NAME}"

          # Validate composed image name roughly (allowed characters)
          if ! echo "$IMAGE_NAME" | grep -qE '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
          echo "ERROR: derived image name is invalid: '$IMAGE_NAME'." >&2
          exit 1
          fi

          # RFC3339 timestamp for label
          IMAGE_CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Export for other steps
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_CREATED=${IMAGE_CREATED}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${REPO_NAME}" >> "$GITHUB_ENV"

          echo "Info: will publish ${IMAGE_NAME}:${RELEASE_TAG} and ${IMAGE_NAME}:latest"

      - name: Setup QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v4.0.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
        with:
          use: true
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ARM64 Docker image with caching
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Show pushed digest (for logging)
        run: |
          echo "Image name: ${{ env.IMAGE_NAME }}"
          echo "Release tag: ${{ env.RELEASE_TAG }}"
          echo "Build outputs digest: '${{ steps.build.outputs.digest }}'"

      - name: Generate artifact attestation
        if: ${{ steps.build.outputs.digest != '' }}
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Success marker
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          echo "SUCCESS: Published ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }} and ${{ env.IMAGE_NAME }}:latest"
