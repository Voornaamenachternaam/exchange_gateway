name: Daily PDF to NDJSON Processor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  process-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # FIXED: Removed trailing space from URL
      TARGET_URL: 'https://officeprotocoldoc.z19.web.core.windows.net/files/Zip_Files/Exchange_Protocols.zip'
      ZIP_FILENAME: 'exchange_protocols.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
          check-latest: true

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pypdf zstandard

      - name: Download ZIP (Robust)
        shell: bash
        run: |
          set -euo pipefail
          
          # Sanitize URL: remove any leading/trailing whitespace just in case
          CLEAN_URL=$(echo "$TARGET_URL" | xargs)
          
          echo "Downloading from: $CLEAN_URL"
          
          # Use curl with retries to handle transient network issues
          curl --fail --location --retry 3 --retry-delay 5 --max-time 600 -o "$ZIP_FILENAME" "$CLEAN_URL"
          
          # Verify download
          if [ ! -f "$ZIP_FILENAME" ]; then
            echo "Error: ZIP file not downloaded."
            exit 1
          fi
          
          unzip -l "$ZIP_FILENAME"

      - name: Extract PDFs
        run: unzip -o -j "$ZIP_FILENAME" "*.pdf"

      - name: Convert PDFs to NDJSON (Strict & Lossless)
        shell: bash
        run: |
          set -euo pipefail
          cat > generate_ndjson.py <<'PY'
          #!/usr/bin/env python3
          import glob, json, gzip, hashlib, os, sys
          from datetime import datetime
          from pypdf import PdfReader

          # Output files
          OUT_RAW = "Exchange_Protocols_pages.ndjson"
          OUT_GZ = "Exchange_Protocols_pages.ndjson.gz"

          pdf_files = sorted(glob.glob("*.pdf"))
          if not pdf_files:
              print("ERROR: No PDF files found.", file=sys.stderr)
              sys.exit(2)

          file_map = {}
          next_id = 1
          total_pages_written = 0
          files_summary = []

          # Open both raw and compressed outputs
          with open(OUT_RAW, "w", encoding="utf-8") as f_raw, \
               gzip.open(OUT_GZ, "wt", encoding="utf-8") as f_gz:

              def write_line(data):
                  line = json.dumps(data, separators=(',',':'), ensure_ascii=False) + "\n"
                  f_raw.write(line)
                  f_gz.write(line)

              # 1. Write Header Manifest
              write_line({
                  "type": "manifest",
                  "status": "in_progress",
                  "generated_at": datetime.utcnow().isoformat() + "Z",
                  "file_count": len(pdf_files),
                  "note": "Optimized layout: file records followed by page records."
              })

              # 2. Pass 1: Metadata
              for pdf_path in pdf_files:
                  filename = os.path.basename(pdf_path)
                  sha256_hash = hashlib.sha256(open(pdf_path, "rb").read()).hexdigest()
                  try:
                      reader = PdfReader(pdf_path)
                      pages_total = len(reader.pages)
                  except Exception as e:
                      pages_total = 0
                  
                  file_map[filename] = {
                      "id": next_id,
                      "path": pdf_path,
                      "pages_total": pages_total,
                      "sha256": sha256_hash
                  }
                  
                  write_line({
                      "type": "file",
                      "id": next_id,
                      "filename": filename,
                      "pages_total": pages_total,
                      "sha256": sha256_hash
                  })
                  next_id += 1

              # 3. Pass 2: Page Content
              for fname in sorted(file_map.keys()):
                  meta = file_map[fname]
                  fid = meta["id"]
                  pdf_path = meta["path"]
                  expected_pages = meta["pages_total"]
                  pages_written = 0
                  errors = []
                  
                  if expected_pages == 0:
                      errors.append("Failed to read PDF or empty file")
                      files_summary.append({
                          "filename": fname, "pages_expected": 0, "pages_written": 0, "errors": errors
                      })
                      continue

                  try:
                      reader = PdfReader(pdf_path)
                      # CRITICAL: Loop 1..N explicitly to catch missing pages
                      for i in range(1, expected_pages + 1):
                          page_text = ""
                          try:
                              # pypdf is 0-indexed
                              page = reader.pages[i-1] 
                              page_text = page.extract_text() or ""
                          except Exception as pe:
                              errors.append(f"Page {i} extraction error: {str(pe)}")
                          
                          write_line({
                              "type": "page",
                              "file_id": fid,
                              "page": i,
                              "text": page_text
                          })
                          pages_written += 1
                          total_pages_written += 1
                          
                          if i % 200 == 0:
                              f_raw.flush()
                              f_gz.flush()
                              
                  except Exception as e:
                      errors.append(f"File processing failed: {str(e)}")

                  files_summary.append({
                      "filename": fname,
                      "pages_expected": expected_pages,
                      "pages_written": pages_written,
                      "sha256": meta["sha256"],
                      "errors": errors
                  })

              # 4. Final Manifest
              write_line({
                  "type": "manifest",
                  "status": "complete",
                  "generated_at": datetime.utcnow().isoformat() + "Z",
                  "file_count": len(pdf_files),
                  "total_pages_written": total_pages_written,
                  "files": files_summary
              })

          print(f"Success: Processed {len(pdf_files)} files, {total_pages_written} pages.")
          print(f"Output: {OUT_RAW} and {OUT_GZ}")
          PY
          
          python generate_ndjson.py

      - name: Validate Data Integrity
        run: |
          echo "Validating page continuity..."
          python - <<'PY'
          import json
          
          # Validate the uncompressed file
          with open("Exchange_Protocols_pages.ndjson", "r", encoding="utf-8") as f:
              lines = f.readlines()
              
          last_manifest = json.loads(lines[-1])
          if last_manifest.get("status") != "complete":
              raise Exception("Processing did not complete successfully.")
          
          missing_pages = 0
          for f_report in last_manifest.get("files", []):
              exp = f_report.get("pages_expected")
              got = f_report.get("pages_written")
              if exp != got:
                  print(f"ERROR: {f_report['filename']} expected {exp} pages, got {got}.")
                  missing_pages += (exp - got)
          
          if missing_pages > 0:
              raise Exception(f"CRITICAL: {missing_pages} pages are missing!")
          
          print("Validation Passed. No data loss detected.")
          PY

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: exchange-protocols-ndjson
          path: |
            Exchange_Protocols_pages.ndjson
            Exchange_Protocols_pages.ndjson.gz
          retention-days: 5
