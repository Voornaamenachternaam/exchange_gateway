# exchange-gateway.config.toml

bind = "[::]:8134"
caldav_base = "http://stalwart:8080/dav/"
database_path = "/var/lib/exchange-gateway/gateway.db"
hmac_secret = "REPLACE_WITH_LONG_RANDOM_HEX"
gateway_host = "exchange.example.com"
mail_domain = "example.com"
