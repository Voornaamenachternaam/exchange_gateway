# PLACEHOLDER CONVENTION — READ BEFORE DEPLOYING
# Every `example.com` hostname in this file is a PLACEHOLDER, not a real
# domain. Replace each one in YOUR copy of this file before deploying
# (e.g. in Portainer); the repository template intentionally keeps the
# placeholders and must not be deployed as-is:
#   example.com              = PLACEHOLDER for your real root / mail domain
#                              (the domain part of your users' email
#                              addresses; set as GATEWAY_MAIL_DOMAIN)
#   mail.example.com         = PLACEHOLDER for your real mailserver hostname
#                              (the MX host; set as GATEWAY_MAIL_HOST)
#   calendar.example.com     = PLACEHOLDER for calendar.<your real domain>
#                              (= GATEWAY_HOST; the public EAS/EWS/MAPI host)
#   autodiscover.example.com = PLACEHOLDER for autodiscover.<your real domain>
#                              (derived from GATEWAY_MAIL_DOMAIN; the host
#                              Android's "Exchange" wizard probes first)
# Invariants that must hold after replacement:
#   GATEWAY_HOST          == calendar.<GATEWAY_MAIL_DOMAIN>
#   Autodiscover host     == autodiscover.<GATEWAY_MAIL_DOMAIN>
#   GATEWAY_MAIL_HOST     == your real MX hostname (mail. + the mail domain
#                            in this deployment, matching the MX record)
# No tunnel route is ever created for the bare root domain: it already has
# A/AAAA records. Only the `calendar.` and `autodiscover.` routes below
# (see CLOUDFLARED_SETUP.md) are needed. A `.env` file is forbidden in this
# deployment — every value lives inline in this file.
services:
  exchange-gateway:
    # --- Registry image (production) --------------------------------------
    # Replace <registry> with the published multi-arch image reference:
    #   docker buildx imagetools inspect <registry>/exchange-gateway:0.1.0
    image: <registry>/exchange-gateway:0.1.0
    container_name: exchange-gateway
    hostname: exchange-gateway
    restart: unless-stopped
    environment:
      - TZ=UTC

      # --- Logging / binding ---------------------------------------------
      - GATEWAY_LOG_LEVEL=info
      # GATEWAY_LOG_FORMAT=text        # text | json (json is handy under Portainer/journalctl)
      # GATEWAY_LOG_JSON=1             # shorthand for GATEWAY_LOG_FORMAT=json
      # GATEWAY_LOG_NO_TIMESTAMPS=0    # 1 drops timestamps (for an external log shipper)
      # GATEWAY_LOG_THREADS=1          # 0 hides the thread id column
      # GATEWAY_LOG_TARGET=1           # 0 hides the module target column
      - GATEWAY_BIND=[::]:8134
      # Optional: path to a TOML config file. The container image ships none;
      # a missing file is tolerated and env vars are used (the deployment
      # contract is compose-only, so leave this unset unless you mount one).
      # - GATEWAY_CONFIG=/etc/exchange-gateway/config.toml

      # --- Stalwart backend (private bridge network) ----------------------
      # The HTTP listener on port 8080 serves CalDAV at /dav/cal, CardDAV at
      # /dav/card and JMAP at /jmap. The CardDAV base is derived from the
      # CalDAV base when not set explicitly (…/dav → …/dav/card); it is set
      # explicitly here for clarity. Contacts use JMAP (RFC 9610) first, with
      # CardDAV as the fallback.
      - GATEWAY_CALDAV_BASE=http://stalwart:8080/dav
      - GATEWAY_JMAP_BASE=http://stalwart:8080/jmap
      # CardDAV root (Stalwart serves the addressbook home at
      # /dav/card/{user}/). The gateway appends "/{user}/".
      - GATEWAY_CARDDAV_BASE=http://stalwart:8080/dav/card

      # Deploy-time JMAP Calendars capability verification: off | warn | enforce.
      # `warn` logs findings and falls back to CalDAV; `enforce` refuses startup.
      #
      # This check needs GATEWAY_ADMIN_USERNAME/PASSWORD below; when they are
      # empty it is skipped with a warning. That is safe: JMAP calendar writes
      # are ALSO protected at runtime — every create/update reads its own result
      # back and, if the backend stored an empty event, the write fails closed,
      # JMAP calendar writes are disabled for the process, and the request falls
      # back to CalDAV. So an empty admin account cannot cause silent calendar
      # data loss. Set the admin credentials to run the full startup check.
      - GATEWAY_CALENDAR_CAPABILITY_CHECK=warn

      # --- Required identity / crypto -------------------------------------
      # >= 32 characters, must NOT start with "REPLACE_". The shipped value
      # below is a placeholder that fails validation; replace it in your copy
      # with `openssl rand -hex 32` output before first start. AUDIT4 item 26:
      # the secret must NOT be committed to the repository — the compose
      # file lives only on the operator machine (Portainer). The
      # `GATEWAY_HMAC_SECRET_FILE` form (a Docker secret mounted at
      # /run/secrets/gateway_hmac) is supported by `get_secret_env` in
      # `src/config.rs`; either form works — a present `_FILE` wins.
      - GATEWAY_HMAC_SECRET=REPLACE_WITH_A_RANDOM_32_CHAR_MINIMUM_SECRET
      # GATEWAY_HOST is the ONE canonical public host: every surface
      # (EAS/EWS/MAPI/OAB/ECP/Autodiscover) is served on it (port 8134) and
      # Autodiscover renders all service URLs from it — no per-protocol
      # tunnel route is needed. It must be a public hostname on the tunnel
      # (see CLOUDFLARED_SETUP.md "One canonical host").
      # PLACEHOLDER: `calendar.example.com` = calendar.<your real domain>.
      # Replace in your copy so that GATEWAY_HOST == calendar. + the mail
      # domain below, i.e. GATEWAY_HOST == calendar.{GATEWAY_MAIL_DOMAIN}.
      - GATEWAY_HOST=calendar.example.com
      # PLACEHOLDER: `example.com` = your real root / mail domain (the
      # domain part of your users' email addresses). It drives the
      # Autodiscover host Android probes (autodiscover.example.com =
      # autodiscover.<your real domain>).
      - GATEWAY_MAIL_DOMAIN=example.com

      # --- Storage --------------------------------------------------------
      - GATEWAY_DATABASE_PATH=/var/lib/exchange-gateway/gateway.db
      # 25 MiB (AUDIT4 item 30): Outlook's 25 MB send cap. The code cap is
      # 50 MiB; 25 MiB attachments yield ~35 MiB of base64 MIMEData inside
      # SendMail. Raise to 50 MiB if the operator needs to send larger.
      - GATEWAY_MAX_ATTACHMENT_BYTES=26214400

      # --- EAS Ping vs. Cloudflare edge timeout (audit P0) ----------------
      # Cloudflare cuts an unanswered request at the 125s Proxy Read Timeout
      # (HTTP 524). This hard cap on the effective EAS Ping hold time keeps the
      # long-poll under the edge limit so push is not silently broken; the
      # client simply re-issues Ping. 80s leaves headroom on both the free and
      # paid plans. `CF-RAY` auto-detection also clamps, but setting this
      # explicitly makes the behaviour independent of the edge headers.
      - GATEWAY_MAX_PING_HEARTBEAT=80

      # --- Rate limiting (per CF-Connecting-IP) ---------------------------
      # Sized for several devices behind one Microsoft datacenter egress IP:
      # Ping re-issues every ~80s per device and Sync bursts are dense. Raise
      # these if the target clients ever see 429s. AUDIT4 item 31 raises the
      # per-minute floor to 1200 (code default 1200; the compose value below
      # overrides it for the shipped template).
      - GATEWAY_RATE_LIMIT_ENABLED=1
      - GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE=1200
      - GATEWAY_RATE_LIMIT_MAX_CONCURRENT=2000

      # --- Auth cache / circuit breaker -----------------------------------
      - GATEWAY_AUTH_CACHE_TTL_SECS=300
      - GATEWAY_AUTH_CACHE_NEGATIVE_TTL_SECS=30
      - GATEWAY_AUTH_CACHE_MAX_ENTRIES=10000
      - GATEWAY_AUTH_PROBE_MIN_INTERVAL_MS=1000
      - GATEWAY_AUTH_BACKEND_FAILURE_THRESHOLD=5
      - GATEWAY_AUTH_BACKEND_MAX_BACKOFF_SECS=60

      # --- Mail plumbing (SMTP/IMAP on Stalwart) --------------------------
      # *_HOST/*_PORT are the backend the gateway talks to over the bridge
      # network; keep them on the Docker service name. AUDIT4 items 18-19:
      # the SMTP/IMAP connection host stays `stalwart` (the bridge service
      # name), while the advertised host (`GATEWAY_MAIL_HOST` + the
      # Autodiscover IMAP/SMTP <Protocol> blocks) is the public MX hostname
      # so TLS verification succeeds. Setting GATEWAY_SMTP_HOST to the
      # public MX name would break the bridge connection; do not do that.
      - GATEWAY_SMTP_HOST=stalwart
      - GATEWAY_SMTP_PORT=465
      - GATEWAY_IMAP_HOST=stalwart
      - GATEWAY_IMAP_PORT=993
      # GATEWAY_MAIL_HOST is ADVERTISED to clients inside Autodiscover's
      # IMAP/SMTP <Protocol> blocks. It must be a PUBLICLY RESOLVABLE name
      # (the MX host), NOT the internal container name — otherwise an
      # IMAP/SMTP-capable client is pointed at an unreachable host.
      # See AUDIT3.MD finding #8.
      # PLACEHOLDER: `mail.example.com` = your real mailserver hostname /
      # MX record (mail. + your real domain in this deployment). Replace in
      # your copy so it matches the existing MX record for example.com.
      - GATEWAY_MAIL_HOST=mail.example.com

      # Plain HTTP to Stalwart only over the private bridge network; the public
      # surface is TLS-terminated in front of the gateway.
      - GATEWAY_ALLOW_INSECURE_HTTP=1

      # --- JMAP-first calendar/contacts -----------------------------------
      # JMAP-first (AUDIT3 §12): calendar reads/writes/free-busy and contacts
      # use JMAP with CalDAV/CardDAV as fallback. GATEWAY_FORCE_CALDAV_CALENDAR=1
      # is an emergency escape hatch ONLY (it forfeits the JMAP-first mandate):
      # flip it to 1 temporarily if the backend's JMAP calendar path regresses,
      # and back to 0 once restored. The JMAP *create/update* write path
      # self-verifies every create/update by read-back and auto-disables
      # lossy writes at runtime (fail-closed to CalDAV); deletes have no
      # read-back verification and are confirmed via `destroyed`.
      - GATEWAY_PREFER_JMAP_CALENDAR=1
      - GATEWAY_PREFER_JMAP_CONTACTS=1
      - GATEWAY_PREFER_CALDAV_FREEBUSY=0
      - GATEWAY_FORCE_CALDAV_CALENDAR=0
      - GATEWAY_ROOM_BOOKING_ENABLED=true
      # AUDIT4 item 22: on Stalwart v1.0.3 there is NO JMAP Task/Note type
      # (v1.0.1 did not have one either; the JMAP-first mandate cannot be met
      # for Tasks/Notes). Do NOT set GATEWAY_PREFER_JMAP_TASKS=1 — it is
      # intentionally omitted; Tasks/Notes stay on CalDAV (VTODO/VJOURNAL)
      # by design, mirroring §15.

      # --- EAS device policy (Provision) ----------------------------------
      # The gateway advertises an all-off, no-op policy, so PolicyKey
      # enforcement is disabled by default (no client friction, no security
      # benefit). Set to 1 to answer a stale/missing X-MS-PolicyKey on any
      # non-Provision command with HTTP 200 + global Status 142, as a real
      # Exchange does when it requires provisioning.
      - GATEWAY_EAS_REQUIRE_POLICY_KEY=0

      # --- Surface gating -------------------------------------------------
      # Autodiscover advertises the mapiHttp <Protocol> block whenever the
      # MAPI/HTTP surface is enabled (AUDIT3 #17). The shipped posture below
      # (MAPI on, HMA off) DOES advertise it, because the MAPI endpoint
      # accepts Basic authentication without HMA (the HMA bearer path is
      # additional, not a requirement) and New Outlook for Windows uses
      # MAPI/HTTP rather than EWS for the mailbox. Set GATEWAY_MAPI_ENABLED=0
      # to omit the block and the /mapi/ routes (404), so clients fall back
      # to EWS/EAS. GATEWAY_MAPI_HMA_ENABLED additionally enables the HMA
      # bearer path (requires issuer + audience).
      - GATEWAY_MAPI_ENABLED=1
      - GATEWAY_MAPI_HMA_ENABLED=0
      - GATEWAY_EMAIL_ENABLED=1
      # MAPI tuning (defaults shown). The OIDC/org values are optional and are
      # only consulted when MAPI is enabled.
      # - GATEWAY_MAPI_CONTENTS_PAGE_SIZE=256
      # - GATEWAY_MAPI_MAX_CONTENTS_ROWS=100000
      # - GATEWAY_MAPI_ORG=
      # - GATEWAY_MAPI_OIDC_ISSUER=
      # - GATEWAY_MAPI_OIDC_AUDIENCE=

      # --- Server identity advertised to clients --------------------------
      - GATEWAY_SERVER_VERSION=15.2.2562.45
      - GATEWAY_SERVER_EXCHANGE_VERSION=Exchange2016

      # --- Stalwart admin account for the full GAL (NSPI + OAB) -----------
      # Leave empty to fall back to the self-only minimal GAL stub. If set,
      # these sit in cleartext in this file — restrict the file's permissions
      # (chmod 600) or use Docker secrets (see AUDIT2.md #22).
      - GATEWAY_ADMIN_USERNAME=
      - GATEWAY_ADMIN_PASSWORD=

      # --- S/MIME GAL certificates (optional) -----------------------------
      # Directory of PEM/DER X.509 (.pem/.der/.cer/.crt) or certs-only CMS
      # "PKCS#7" (.p7b/.p7c) files imported at startup. Leave empty to serve
      # only harvested certificates.
      - GATEWAY_SMIME_CERT_STORE_DIR=

    ports:
      # Loopback only: host-run cloudflared reaches the container via
      # http://localhost:8134 (the Zero-Trust routes target port 8134 on
      # the host). Never publish on a wildcard bind — that would expose
      # plain HTTP + Basic auth to the LAN/WAN, bypassing the tunnel.
      - 127.0.0.1:8134:8134
    volumes:
      # Host path the operator creates (per the deployment scenario):
      #   /armblock/exchange-gateway-data  (must be writable by UID 10001)
      - /armblock/exchange-gateway-data:/var/lib/exchange-gateway
      # OPTIONAL operator-seeded S/MIME certificate store for the GAL. Create
      # the host directory (or remove this line) before first start.
      # - /armblock/exchange-gateway-certs:/var/lib/exchange-gateway/certs
    # Resolver for the gateway container. Set to the operator's DNS servers, or
    # delete this block to inherit the Docker daemon's resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - network1
    healthcheck:
      # Readiness-aware: Docker marks the container UNHEALTHY when the Stalwart
      # auth backend is unreachable, not just when the process dies.
      # `restart: unless-stopped` alone does NOT restart an unhealthy
      # container — pair this with a health-aware controller (the optional
      # autoheal service below) if automatic restarts are wanted.
      test: ["CMD", "curl", "-f", "http://localhost:8134/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # OPTIONAL health-aware restart controller. Stock Compose only MARKS the
  # gateway unhealthy on readiness failure; it never restarts it. Uncomment
  # this service (and the `autoheal` label on exchange-gateway) to have
  # willfarrell/autoheal restart the gateway automatically when readiness
  # keeps failing.
  # autoheal:
  #   image: willfarrell/autoheal:latest
  #   container_name: autoheal
  #   restart: unless-stopped
  #   environment:
  #     - AUTOHEAL_CONTAINER_LABEL=autoheal
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

networks:
  network1:
    name: my-bridge-network
    external: true
