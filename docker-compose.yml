# docker-compose.yml
# Docker Compose configuration for exchange_gateway.
# Deploy with: docker-compose up -d

services:
  exchange_gateway:
    build: .
    container_name: exchange_gateway
    restart: unless-stopped
    environment:
      - TZ=${GATEWAY_TZ:-UTC}
      - RUST_LOG=${RUST_LOG:-info}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-example.com}
    volumes:
      - ./config.toml:/etc/exchange-gateway/config.toml:ro
    ports:
      - "8134:8134"
    networks:
      my-bridge-network:
        ipv4_address: 172.28.0.11

networks:
  my-bridge-network:
    external: true
