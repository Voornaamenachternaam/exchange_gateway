# docker-compose.yml
services:
  exchange-gateway:
    build: .
    container_name: exchange-gateway
    image: exchange-gateway:latest
    restart: unless-stopped
    ports:
      - "8134:8134"
    environment:
      # Logging configuration
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
      - GATEWAY_LOG_FORMAT=${GATEWAY_LOG_FORMAT:-pretty}
      - GATEWAY_LOG_THREADS=${GATEWAY_LOG_THREADS:-false}
      - GATEWAY_LOG_TARGET=${GATEWAY_LOG_TARGET:-false}
      - GATEWAY_LOG_NO_TIMESTAMPS=${GATEWAY_LOG_NO_TIMESTAMPS:-false}
      # Backwards compatibility
      - RUST_LOG=${GATEWAY_RUST_LOG:-}
      - TZ=${GATEWAY_TZ:-UTC}
      - GATEWAY_BIND=${GATEWAY_BIND:-[::]:8134}
      # CalDAV (calendar) backend — Stalwart
      - GATEWAY_CALDAV_BASE=${GATEWAY_CALDAV_BASE}
      # JMAP (email) backend — Stalwart
      - GATEWAY_JMAP_BASE=${GATEWAY_JMAP_BASE:-}
      # SMTP (email sending) backend — Stalwart
      - GATEWAY_SMTP_HOST=${GATEWAY_SMTP_HOST:-}
      - GATEWAY_SMTP_PORT=${GATEWAY_SMTP_PORT:-465}
      # Email toggle
      - GATEWAY_EMAIL_ENABLED=${GATEWAY_EMAIL_ENABLED:-true}
      # Mail server hostname for autodiscover IMAP/SMTP settings
      - GATEWAY_MAIL_HOST=${GATEWAY_MAIL_HOST:-}
      # Core settings
      - GATEWAY_HMAC_SECRET=${GATEWAY_HMAC_SECRET}
      - GATEWAY_HOST=${GATEWAY_HOST}
      - GATEWAY_MAIL_DOMAIN=${GATEWAY_MAIL_DOMAIN}
      - GATEWAY_DATABASE_PATH=${GATEWAY_DATABASE_PATH:-/var/lib/exchange-gateway/gateway.db}
      - GATEWAY_MAX_ATTACHMENT_BYTES=${GATEWAY_MAX_ATTACHMENT_BYTES:-5242880}
      - GATEWAY_ROOM_BOOKING_ENABLED=${GATEWAY_ROOM_BOOKING_ENABLED:-true}
      - GATEWAY_AUTH_CACHE_TTL_SECS=${GATEWAY_AUTH_CACHE_TTL_SECS:-300}
      - GATEWAY_AUTH_CACHE_MAX_ENTRIES=${GATEWAY_AUTH_CACHE_MAX_ENTRIES:-10000}
    volumes:
      - exchange-gateway-data:/var/lib/exchange-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8134/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - exchange-network

volumes:
  exchange-gateway-data:
    driver: local

networks:
  exchange-network:
    driver: bridge