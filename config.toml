# Exchange Gateway Configuration
# Production configuration for Stalwart Mailserver v0.15.5
# Domain: example.com (replace with actual domain)

# Bind address - listens on all interfaces
bind = "0.0.0.0:8134"

# Stalwart Mailserver CalDAV base URL
# Uses internal Docker network IP - adjust for your setup
caldav_base = "http://stalwart:8080/dav/"

# Cloudflare Worker URL for D1 storage
# Format: https://<worker>.<account>.workers.dev/api
# Replace with your actual Cloudflare Worker URL
worker_url = "https://exchange-gateway-db.<your-account>.workers.dev/api"

# Worker secret - generate a strong random secret
# Use: openssl rand -hex 32
worker_secret = "YOUR_STRONG_SECRET_HERE"

# HMAC secret for generating server IDs from CalDAV hrefs
# Use: openssl rand -hex 32
hmac_secret = "YOUR_HMAC_SECRET_HERE"
