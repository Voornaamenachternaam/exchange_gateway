[package]
name = "exchange_gateway"
version = "1.0.23"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
tokio = { version = "^1.50.0", features = ["full"] }
axum = { version = "^0.8.8", features = ["macros"] }
hyper = "^1.8.1"
reqwest = { version = "^0.13.2", features = ["rustls", "json"] }
quick-xml = { version = "^0.39.2", features = ["serialize"] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.149"
toml = "^1.1.0"
anyhow = "^1.0.102"
uuid = { version = "^1.23.0", features = ["v4"] }
chrono = { version = "^0.4.44", features = ["serde"] }
chrono-tz = "^0.10.4"
rrule = "^0.14.0"
icalendar = "^0.17.6"
hmac = "^0.12.1"
sha2 = "^0.11.0"
bytes = "^1.11.1"
lazy_static = "^1.5.0"
once_cell = "^1.21.4"
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["fmt", "env-filter"] }
urlencoding = "^2.1.3"
base64 = "^0.22.1"
url = "^2.5.8"
tower-http = { version = "^0.6.8", features = ["trace"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = []
