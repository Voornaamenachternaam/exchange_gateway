[package]
name = "exchange_gateway"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
axum = { version = "0.8.8", features = ["macros"] }
hyper = "1.9.0"
reqwest = { version = "0.13.2", features = ["rustls", "json"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.0"
anyhow = "1.0.102"
thiserror = "2.0.18"
uuid = { version = "1.22.0", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
rrule = "0.14.0"
icalendar = "0.17.6"
hmac = "0.13.0"
sha2 = "0.11.0"
bytes = "1.11.1"
lazy_static = "1.5.0"
once_cell = "1.21.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
urlencoding = "2.1.3"
base64 = "0.22.1"
url = "2.5.8"
tower-http = { version = "0.6.8", features = ["trace"] }
parking_lot = "0.12.5"
futures = "0.3.32"
compact_str = { version = "0.9.0", features = ["serde"] }
calcard = "0.3.2"
headers = "0.4.1"
flate2 = "1.1.0"
tokio-util = { version = "0.7.18", features = ["codec", "io"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = []
