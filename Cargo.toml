# Cargo.toml
[package]
name = "exchange_gateway"
version = "1.2.0"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
tokio = "^1.51.1"
axum = "^0.8.9"
hyper = "^1.9.0"
hyper-util = "^0.1.20"
reqwest  = "^0.13.2"
reqwest-middleware = "^0.5.1"
reqwest-retry = "^0.9.1"
reqwest-tracing = "^0.7.0"
quick-xml = "^0.39.2"
nom = "^8.0.0"
serde =  "^1.0.228"
serde_json = "^1.0.149"
toml = "^1.1.2"
validator = "^0.19.0"
anyhow = "^1.0.102"
thiserror = "^2.0.18"
uuid = "^1.23.0"
chrono = "^0.4.44"
chrono-tz = "^0.10.4"
rrule = "^0.14.0"
hmac = "^0.13.0"
sha2 = "^0.11.0"
bytes = "^1.11.1"
tracing = "^0.1.44"
tracing-subscriber = "^0.3.23"
tracing-opentelemetry = "^0.29.0"
opentelemetry  = "^0.29.0"
opentelemetry_sdk = "^0.29.0"
opentelemetry-otlp = "^0.29.0"
urlencoding = "^2.1.3"
base64 = "^0.22.1"
url = "^2.5.8"
percent-encoding = "^2.3.2"
tower = "^0.5.3"
tower-http = "^0.6.8"
parking_lot = "^0.12.5" 
futures-util = "^0.3.32"
futures-core = "^0.3.32"
compact_str = "^0.9.0"
calcard = "^0.3.2"
headers = "^0.4.1"
flate2 = "^1.1.9"
tokio-util = "^0.7.18"
tokio-stream = "^0.1.18"
secrecy = "^0.10.3"
zeroize = "^1.8.2"
subtle = "^2.6.1"
pin-project-lite = "^0.2.17"
http-body-util = "^0.1.3"
mime = "^0.3.17"
lru = "^0.16.3"
memchr = "^2.7.5"
itoa = "^1.0.15"
ryu = "^1.0.20"
windows-timezones = "^0.5.1"
strum = "~0.27.2"
dashmap = "^6.1.0"
smallvec = "^1.15.0"
http = "^1.3.0"
smartstring = "^1.0.1"

[dev-dependencies]
proptest = "^1.11.0"
criterion = "^0.8.2"
tokio-test = "^0.4.5"
insta = "^1.43.0"
pretty_assertions = "^1.4.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[features]
default = []
benchmark = []
