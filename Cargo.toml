[package]
name = "exchange_gateway"
version = "1.0.21"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
tokio = { version = "^1.49.0", features = ["full"] }
axum = "^0.8.8"
hyper = "^1.8.1"
reqwest = { version = "^0.13.2", features = ["rustls", "json"] }
quick-xml = "^0.39.2"
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.149"
toml = "^1.0.3"
anyhow = "^1.0.102"
uuid = { version = "^1.21.0", features = ["v4"] }
chrono = { version = "^0.4.44", features = ["serde"] }
rrule = "^0.14.0"
icalendar = "^0.17.6"
hmac = "^0.12.1"
sha2 = "^0.10.9"
bytes = "^1.11.1"
lazy_static = "^1.5.0"
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.22", features = ["fmt", "env-filter"] }
urlencoding = "^2.1.3"
base64 = "^0.22.1"
xsd-parser = { version = "1.5.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = []
xsd-validation = ["xsd-parser"]
