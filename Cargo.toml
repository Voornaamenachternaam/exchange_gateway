[package]
name = "exchange_gateway"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
tokio = { version = "^1.50.0", features = ["full", "tracing"] }
axum = { version = "^0.8.8", features = ["macros", "tracing"] }
hyper = "^1.9.0"
reqwest = { version = "^0.13.2", features = ["rustls", "json", "gzip", "brotli", "deflate"] }
quick-xml = { version = "^0.39.2", features = ["serialize", "async-tokio"] }
serde = { version = "^1.0.228", features = ["derive", "rc"] }
serde_json = "^1.0.149"
toml = "^1.1.0"
anyhow = "^1.0.102"
thiserror = "^2.0.18"
uuid = { version = "^1.22.0", features = ["v4", "v7", "serde"] }
chrono = { version = "^0.4.44", features = ["serde", "clock"] }
chrono-tz = "^0.10.4"
rrule = "^0.14.0"
icalendar = "^0.17.6"
hmac = "^0.13.0"
sha2 = "^0.11.0"
bytes = "^1.11.1"
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["fmt", "env-filter", "registry"] }
urlencoding = "^2.1.3"
base64 = "^0.22.1"
url = "^2.5.8"
tower = { version = "^0.5.3", features = ["util", "limit"] }
tower-http = { version = "^0.6.8", features = ["trace", "cors", "limit", "timeout", "request-id", "sensitive-headers"] }
parking_lot = { version = "^0.12.5", features = ["send_guard"] }
futures = "^0.3.32"
compact_str = { version = "^0.9.0", features = ["serde", "bytes"] }
calcard = "^0.3.2"
headers = "^0.4.1"
flate2 = "^1.1.0"
tokio-util = { version = "^0.7.18", features = ["codec", "io", "compat"] }
secrecy = { version = "^0.10.3", features = ["serde"] }
zeroize = { version = "^1.8.2", features = ["derive", "serde"] }
subtle = "^2.6.1"
dashmap = "^6.1.0"
tokio-stream = { version = "^0.1.18", features = ["sync"] }
pin-project-lite = "^0.2.17"

[dev-dependencies]
proptest = "^1.11.0"
criterion = { version = "^0.8.2", features = ["async_tokio"] }
tokio-test = "^0.4.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[features]
default = []
benchmark = []
