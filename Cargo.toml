[package]
name = "exchange_gateway"
version = "0.3.3"
edition = "2024"
rust-version = "1.93.0"

[dependencies]
# Tokio runtime
tokio = { version = "^1.49.0", features = ["full"] }

# HTTP server / framework
axum = "^0.8.8"
hyper = "^1.8.1"

# HTTP client (reqwest) - using rustls + json features (valid feature names).
reqwest = { version = "^0.13.2", features = ["rustls", "json"] }

# XML parsing (quick-xml) - pinned to published version on docs.rs/crates
quick-xml = "^0.39.0"

# Serialization
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.149"
toml = "^1.0.1"

# SQLx - use separate runtime + TLS + sqlite + macros (matches SQLx docs)
sqlx = { version = "^0.8.6", features = ["sqlite", "runtime-tokio", "tls-rustls", "macros"] }

# Errors, tracing, utilities
anyhow = "^1.0.101"
thiserror = "^2.0.18"
tracing = "^0.1.44"
tracing-subscriber = "^0.3.22"

# Binary/utility crates and crypto helpers
base64 = "^0.22.1"
uuid = { version = "^1.21.0", features = ["v4"] }
chrono = { version = "^0.4.43", features = ["serde"] }

# Calendar/recurrence / iCalendar helpers
rrule = "^0.14.0"
icalendar = "^0.17.6"

# crypto helpers
hmac = "^0.12.1"
sha2 = "^0.10.9"

# bytes & misc
bytes = "^1.11.1"
lazy_static = "^1.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Note: panic = "unwind" (default) ensures Drop implementations run,
# allowing MemoryLock and Zeroize to clean up secrets even on panic.
# This is more important than preventing stack unwinding for a security tool.
strip = true     # Strips symbols
