# Cargo.toml
[package]
name = "exchange_gateway"
version = "1.3.0"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
tokio = { version = "^1.52.1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "tracing", "macros", "io-util", "fs"] }
reqwest = { version = "^0.12.0", features = ["json", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware = "^0.3.0"
reqwest-retry = "^0.6.0"
axum = { version = "^0.8.9", features = ["macros", "tracing", "json", "query", "matched-path", "original-uri"] }
axum-extra = { version = "^0.12.6", features = ["typed-header"] }
quick-xml = { version = "^0.39.2", features = ["serialize", "async-tokio", "encoding"] }
nom = "^8.0.0"
serde = { version = "^1.0.228", features = ["derive", "rc", "std"] }
serde_json = "^1.0.149"
toml = "^1.1.2"
anyhow = "^1.0.102"
thiserror = "^2.0.18"
uuid = { version = "^1.23.1", features = ["v4", "v7", "serde"] }
chrono = { version = "^0.4.44", features = ["serde", "clock", "std"] }
chrono-tz = "^0.10.4"
rrule = "^0.14.0"
hmac = "^0.13.0"
sha2 = "^0.11.0"
bytes = "^1.11.1"
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["fmt", "env-filter", "registry", "json"] }
urlencoding = "^2.1.3"
base64 = "^0.22.1"
base64ct = { version = "^1.8.3", features = ["std"] }
url = "^2.5.8"
percent-encoding = "^2.3.2"
tower = { version = "^0.5.3", features = ["util", "limit", "timeout", "buffer"] }
tower-http = { version = "^0.6.8", features = ["trace", "cors", "limit", "timeout", "request-id", "sensitive-headers", "decompression-full", "compression-full", "set-header"] }
parking_lot = { version = "^0.12.5", features = ["send_guard"] }
futures-util = "^0.3.32"
futures-core = "^0.3.32"
compact_str = { version = "^0.9.0", features = ["serde", "bytes"] }
headers = "^0.4.1"
flate2 = "^1.1.9"
tokio-util = { version = "^0.7.18", features = ["codec", "io", "compat", "rt"] }
tokio-stream = { version = "^0.1.18", features = ["sync", "net"] }
secrecy = { version = "^0.10.3", features = ["serde"] }
zeroize = { version = "^1.8.2", features = ["derive", "serde"] }
subtle = "^2.6.1"
pin-project-lite = "^0.2.17"
http-body-util = "^0.1.3"
mime = "^0.3.17"
lru = "^0.18.0"
moka = { version = "^0.12.15", features = ["sync"] }
arc-swap = "^1.9.1"
memchr = "^2.8.0"
itoa = "^1.0.18"
ryu = "^1.0.23"
windows-timezones = { version = "^0.5.1", features = ["strum", "chrono-tz"] }
strum = { version = "~0.27.2", features = ["derive"] }
dashmap = "^6.1.0"
smallvec = { version = "^1.15.1", features = ["serde", "write"] }
http = "^1.4.0"
smartstring = "^1.0.1"
const-hex = "^1.18.1"
bitflags = "^2.11.1"
unicode-normalization = "^0.1.25"
phf = { version = "^0.13.1", features = ["macros"] }
icalendar = { version = "^0.17.10", features = ["parser", "chrono-tz"] }
email_address = "^0.2.9"
iso8601-duration = "^0.2.0"
roxmltree = "^0.21.1"
itertools = "^0.14.0"
derive_more = { version = "^2.1", features = ["full"] }
bstr = "^1.12.1"
r2d2 = "^0.8.10"
rusqlite = { version = "^0.39.0", features = ["bundled"] }
serde_rusqlite = "0.42.0"
r2d2_sqlite = { version = "^0.33.0", features = ["bundled"] }

[dev-dependencies]
proptest = "^1.11.0"
criterion = { version = "^0.8.2", features = ["async_tokio"] }
tokio-test = "^0.4.5"
insta = "^1.47.2"
pretty_assertions = "^1.4.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[features]
default = []
benchmark = []
