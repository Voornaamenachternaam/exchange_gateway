[package]
name = "exchange_gateway"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Exchange Gateway Team"]
description = "Exchange ActiveSync and EWS gateway for Stalwart Mailserver"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "^1.50.0", features = ["full"] }
tokio-util = "^0.7.18"
axum = "0.8.8"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
hyper = { version = "1.8.1", features = ["full"] }
reqwest = { version = "^0.13.2", features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
quick-xml = { version = "0.39.2", features = ["serialize"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.22.1"
sha2 = "0.11.0"
md5 = "0.8.0"
x509-parser = "0.18.1"
pem = "3.0.6"
regex = "1.12.3"
rand = "0.10.0"
thiserror = "2.0.18"
anyhow = "1.0.102"
config = "0.15.22"
dotenvy = "0.15.7"
url = "2.5.8"
headers = "0.4.1"
mime = "0.3.17"
multer = "3.1.0"
flate2 = "1.1.9"

[dev-dependencies]
tokio-test = "0.4.5"
wiremock = "0.6.5"
mockall = "0.14.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
