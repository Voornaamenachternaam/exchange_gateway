[package]
name = "exchange-gateway-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "=1.5.0", features = ["derive"] }
exchange_gateway = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "wbxml_decode"
path = "fuzz_targets/wbxml_decode.rs"
test = false
doc = false

[[bin]]
name = "wbxml_roundtrip"
path = "fuzz_targets/wbxml_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "wbxml_grammar"
path = "fuzz_targets/wbxml_grammar.rs"
test = false
doc = false

[[bin]]
name = "icalendar_parse"
path = "fuzz_targets/icalendar_parse.rs"
test = false
doc = false

[[bin]]
name = "icalendar_grammar"
path = "fuzz_targets/icalendar_grammar.rs"
test = false
doc = false

[[bin]]
name = "mapi_rop"
path = "fuzz_targets/mapi_rop.rs"
test = false
doc = false

[[bin]]
name = "mapi_tnef"
path = "fuzz_targets/mapi_tnef.rs"
test = false
doc = false


