# wrangler.toml

name = "exchange-gateway-edge"
main = "../worker/index.js"
compatibility_date = "2026-03-22"
compatibility_flags = ["nodejs_compat"]

[vars]
GATEWAY_HOST = "exchange.example.com"

ORIGIN_BASE_URL = "https://exchange-origin.example.com"

RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_MAX = "120"
RATE_LIMIT_WINDOW_SEC = "60"

MAX_FORWARD_BODY_BYTES = "4194304"
UPSTREAM_TIMEOUT_MS = "30000"

[[routes]]
pattern = "exchange.example.com/EWS/*"
zone_name = "example.com"

[[routes]]
pattern = "exchange.example.com/OAB/*"
zone_name = "example.com"

[[routes]]
pattern = "exchange.example.com/Microsoft-Server-ActiveSync"
zone_name = "example.com"

[[routes]]
pattern = "exchange.example.com/autodiscover/*"
zone_name = "example.com"

[[routes]]
pattern = "exchange.example.com/Autodiscover/*"
zone_name = "example.com"

[[routes]]
pattern = "exchange.example.com/health"
zone_name = "example.com"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"


[triggers]
crons = ["0 * * * *"]


[build]
command = ""

[env.preview]
name = "exchange-gateway-edge-preview"

[env.preview.vars]
GATEWAY_HOST = "exchange-preview.example.com"
ORIGIN_BASE_URL = "https://exchange-origin-preview.example.com"
RATE_LIMIT_ENABLED = "false"
MAX_FORWARD_BODY_BYTES = "4194304"
UPSTREAM_TIMEOUT_MS = "30000"


[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"
