version: "3.8"
services:
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart
    hostname: mail.example.com
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - /armblock/stalwart/opt:/opt/stalwart
    ports:
      - "8080:8080"
      - "25:25"
      - "465:465"
      - "587:587"
    networks:
      my-bridge-network:
        ipv4_address: 172.28.0.10

  exchange_gateway:
    image: youruser/exchange_gateway:latest
    container_name: exchange_gateway
    hostname: exchange_gateway
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
      - RUST_LOG=info
    volumes:
      - /armblock/exchange_gateway/config.toml:/etc/exchange-gateway/config.toml:ro
    ports:
      - "8133:8133"
    depends_on:
      - stalwart
    networks:
      my-bridge-network:
        ipv4_address: 172.28.0.11

networks:
  my-bridge-network:
    external: true
